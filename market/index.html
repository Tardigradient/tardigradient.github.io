<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Big Epic Pirates</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a0f08;
      --paper-strong: rgba(215, 186, 120, 0.92);
      --rule: #2a160c;
      --accent: #6b2b1a;
      --shadow: rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "IM Fell English", "Times New Roman", serif;
      background: url("/mapbg3.jpg") center / cover no-repeat fixed;
      display: grid;
      place-items: center;
      padding: 32px;
    }

    .board {
      width: min(1100px, 95vw);
      min-height: min(620px, 85vh);
      background: rgba(233, 203, 140, 0.82);
      border: 8px solid var(--rule);
      box-shadow: 0 18px 35px var(--shadow);
      display: grid;
      grid-template-columns: 1fr 10px 1fr;
      gap: 0;
      position: relative;
      padding: 28px 24px;
    }

    .divider {
      background: var(--rule);
      width: 10px;
    }

    .panel {
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 24px;
    }

    .panel.left {
      height: 100%;
    }

    h1 {
      font-family: "Pirata One", "IM Fell English", serif;
      font-size: clamp(2.4rem, 4vw, 3.6rem);
      margin: 0 0 12px 0;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 3px solid var(--ink);
      display: inline-block;
      padding-bottom: 6px;
    }

    h2 {
      font-family: "Pirata One", "IM Fell English", serif;
      font-size: clamp(1.6rem, 2.6vw, 2.2rem);
      margin: 14px 0 6px 0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .rules {
      font-size: clamp(1.4rem, 2.4vw, 2rem);
      line-height: 1.4;
      display: grid;
      gap: 24px;
      text-transform: uppercase;
    }

    .rules.rules-left {
      display: grid;
      gap: 36px;
      padding: 12px 0 16px 0;
    }

    .rules p {
      margin: 0;
      border-bottom: 2px solid transparent;
      padding-bottom: 6px;
    }

    .rules p::before {
      content: "✶ ";
      color: var(--accent);
    }

    .market {
      display: grid;
      gap: 18px;
      margin-top: 12px;
    }

    .market-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      font-size: clamp(1.5rem, 2.6vw, 2.2rem);
      text-transform: uppercase;
      border-bottom: 2px dashed rgba(26, 15, 8, 0.35);
      padding: 12px 0;
    }

    .market-row span:last-child {
      font-family: "Pirata One", "IM Fell English", serif;
      padding-left: 22px;
      min-width: 40px;
      text-align: right;
    }

    .price-change {
      animation: flash 0.8s ease;
    }

    @keyframes flash {
      0% { color: var(--accent); transform: translateY(-2px); }
      100% { color: var(--ink); transform: translateY(0); }
    }

    @media (max-width: 820px) {
      .board {
        grid-template-columns: 1fr;
        grid-template-rows: auto 8px auto;
      }

      .divider {
        width: 100%;
        height: 8px;
      }

      .panel {
        padding: 12px 12px 20px 12px;
      }
    }
  </style>
</head>
<body>
  <main class="board">
    <section class="panel left">
      <div>
        <h1>Hook Pistol Cutlass</h1>
        <div class="rules rules-left">
          <p>PISTOL beats CUTLASS</p>
          <p>CUTLASS beats HOOK</p>
          <p>HOOK beats PISTOL</p>
        </div>
      </div>
    </section>

    <div class="divider" aria-hidden="true"></div>

    <section class="panel">
      <div>
        <h1>Market Prices</h1>
        <div class="market" id="market">
          <div class="market-row" data-item="beans"><span>Coffee</span><span class="price">5</span></div>
          <div class="market-row" data-item="sugar"><span>Sugar</span><span class="price">4</span></div>
          <div class="market-row" data-item="grog"><span>Rum</span><span class="price">3</span></div>
          <div class="market-row" data-item="silk"><span>Silk</span><span class="price">2</span></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const items = Array.from(document.querySelectorAll(".market-row"));
    const priceRange = { min: 2, max: 5 };

    function randomPrice(current) {
      let next = current;
      while (next === current) {
        next = Math.floor(Math.random() * (priceRange.max - priceRange.min + 1)) + priceRange.min;
      }
      return next;
    }

    function scheduleUpdate(row) {
      const priceEl = row.querySelector(".price");
      const current = Number(priceEl.textContent.trim());
      const next = randomPrice(current);
      priceEl.textContent = next;
      priceEl.classList.remove("price-change");
      void priceEl.offsetWidth;
      priceEl.classList.add("price-change");

      const base = 50000;
      const jitter = Math.floor(Math.random() * 25000) - 12000; // -12s to +13s
      const nextDelay = Math.max(35000, base + jitter);

      setTimeout(() => scheduleUpdate(row), nextDelay);
    }

    items.forEach((row, index) => {
      const stagger = 8000 * index + Math.random() * 5000;
      setTimeout(() => scheduleUpdate(row), stagger);
    });
  </script>
</body>
</html>
